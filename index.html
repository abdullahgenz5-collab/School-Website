    <style>
        /* ============================================
           DESIGN TOKENS — :root custom properties
           ============================================ */
        :root {
            /* Colors - Sophisticated Dark Palette */
            --color-bg: #050505;
            --color-surface: rgba(255, 255, 255, 0.03);
            --color-surface-elevated: rgba(255, 255, 255, 0.06);
            --color-primary: #f97316;
            --color-primary-hover: #fb923c;
            --color-primary-glow: rgba(249, 115, 22, 0.35);
            --color-ember-gold: #f59e0b;
            --color-ember-purple: #8b5cf6;
            --color-text-primary: #ffffff;
            --color-text-secondary: #e0e0e0;
            --color-text-muted: rgba(255, 255, 255, 0.4);
            --color-border: rgba(255, 255, 255, 0.08);
            --color-success: #10b981;
            --color-danger: #ef4444;

            /* Typography */
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.6);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.8);
            --shadow-glow: 0 0 30px rgba(249, 115, 22, 0.12);

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;

            /* Motion */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 200ms;
            --duration-base: 400ms;
            --duration-slow: 600ms;
        }

        /* ============================================
           BASE STYLES
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            min-height: 100vh;
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================
           STARFIELD CANVAS — single background canvas
           ============================================ */
        #starfield-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================
           VIEW SYSTEM — slide transitions
           ============================================ */
        .view-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 10;
        }

        .view {
            display: none;
            position: relative;
            width: 100%;
        }

        .view.active {
            display: block;
        }

        /* Slide transition states */
        .view.slide-in-right {
            animation: slideInRight var(--duration-base) var(--ease-out-expo) forwards;
        }
        .view.slide-out-left {
            animation: slideOutLeft var(--duration-base) var(--ease-out-expo) forwards;
            position: absolute;
        }
        .view.slide-in-left {
            animation: slideInLeft var(--duration-base) var(--ease-out-expo) forwards;
        }
        .view.slide-out-right {
            animation: slideOutRight var(--duration-base) var(--ease-out-expo) forwards;
            position: absolute;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to   { transform: translateX(-100%); opacity: 0; }
        }
        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to   { transform: translateX(100%); opacity: 0; }
        }

        /* Entrance fade+scale animation */
        .entrance-animate {
            opacity: 0;
            transform: scale(0.92);
        }
        .entrance-animate.revealed {
            animation: entranceReveal var(--duration-slow) var(--ease-out-expo) forwards;
        }
        @keyframes entranceReveal {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ============================================
           CARD / SURFACE COMPONENT
           ============================================ */
        .card-surface {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            position: relative;
            overflow: hidden;
        }
        .card-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        /* 🌟 CHANGE 1: YE CSS ADD KARO - PEACHY GLOW EFFECT */
        .card-surface::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.06) 0%, transparent 70%);
            animation: peachyPulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes peachyPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.15) rotate(5deg); opacity: 0.8; }
        }

        /* ============================================
           BUTTON COMPONENT — .btn-glow
           ============================================ */
        .btn-glow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            color: #ffffff;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out-expo);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity var(--duration-fast);
        }
        .btn-glow:hover {
            border-color: rgba(249, 115, 22, 0.6);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.35), 0 6px 20px rgba(0,0,0,0.6);
            color: #ffffff;
            transform: translateY(-2px);
        }
        .btn-glow:hover::after { opacity: 1; }
        .btn-glow:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.2);
        }
        .btn-glow:disabled,
        .btn-glow[aria-disabled="true"] {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
            transform: none;
            box-shadow: none;
        }
        .btn-glow:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 3px;
        }

        /* Voted button variant */
        .btn-glow.voted-btn {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%) !important;
            border-color: rgba(251, 146, 60, 0.8) !important;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.4) !important;
            color: white !important;
        }

        /* Back button variant */
        .btn-glow.btn-back {
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
        }

        /* ============================================
           TABLE STYLES
           ============================================ */
        .results-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
        }
        .results-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--color-text-secondary);
            font-family: var(--font-display);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        .results-table td {
            padding: 0.625rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--color-text-primary);
        }
        .results-table tbody tr {
            transition: background var(--duration-fast);
            cursor: pointer;
            opacity: 0;
            transform: translateX(-40px);
        }
        .results-table tbody tr.revealed {
            animation: rowReveal var(--duration-base) var(--ease-out-expo) forwards;
        }
        .results-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .results-table tbody tr:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: -2px;
        }
        @keyframes rowReveal {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* Scrollable table wrapper */
        .table-scroll-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            max-height: 60vh;
            overflow-y: auto;
        }
        .table-scroll-wrapper::-webkit-scrollbar {
            width: 6px; height: 6px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-full);
        }

        /* ============================================
           VOTE RESULTS BAR
           ============================================ */
        .vote-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-top: 0.375rem;
        }
        .vote-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #fb923c);
            border-radius: var(--radius-full);
            transition: width 0.6s var(--ease-out-expo);
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
        }

        /* ============================================
           STUDENT DETAIL IMAGE
           ============================================ */
        .detail-image {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-md);
        }

        /* ============================================
           ACCESSIBILITY — prefers-reduced-motion
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            .view.slide-in-right,
            .view.slide-in-left,
            .view.slide-out-left,
            .view.slide-out-right {
                animation: none;
                transform: none;
                opacity: 1;
            }
            .entrance-animate.revealed {
                animation: none;
                opacity: 1;
                transform: scale(1);
            }
            .results-table tbody tr.revealed {
                animation: none;
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ============================================
           RESPONSIVE TWEAKS
           ============================================ */
        @media (max-width: 480px) {
            .results-table th,
            .results-table td {
                padding: 0.5rem 0.625rem;
                font-size: 0.8rem;
            }
            .btn-glow {
                padding: 0.625rem 1.25rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>

    <!-- ============================================
         CANVAS STARFIELD SYSTEM — Steps 4-10
         Hand-rolled 2D Canvas implementation
         ============================================ -->
    <script>
        (function() {
            const canvas = document.getElementById('starfield-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let stars = [];
            let animationId = null;
            let dpr = window.devicePixelRatio || 1;
            let width = 0;
            let height = 0;

            let time = 0;
            let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // STEP 6: Mouse parallax tracking
            let mouseX = 0;
            let mouseY = 0;
            let hasMouse = false;
            let currentOffsetX = 0;
            let currentOffsetY = 0;
            const MAX_PARALLAX_PX = 20;
            const PARALLAX_EASE = 0.04;

            // STEP 8: Scroll warp tracking
            let warpIntensity = 0;
            let lastScrollTime = performance.now();

            // Color palette for stars
            const STAR_PALETTES = [
                { r: 255, g: 255, b: 255 }, // pure white
                { r: 220, g: 240, b: 255 }, // soft ice blue
                { r: 180, g: 230, b: 255 }, // light cyan
                { r: 255, g: 235, b: 200 }  // warm amber tint
            ];

            // STEP 4: Adaptive star count formula
            // Desktop (~1920px -> ~2073k px) => ~250-320 stars (clamped to 310)
            // Small mobile (~375px -> ~250k px) => ~120-150 stars (calculated ~141)
            function calculateTargetStarCount(w, h) {
                const area = w * h;
                const count = Math.round(110 + (area / 8000));
                return Math.max(120, Math.min(310, count));
            }

            // STEP 5: Create a star with depth bands
            function createStar(w, h) {
                const randDepth = Math.random();
                let depth;
                let baseAlpha;
                let radius;

                // Distribution: ~60% far (0.0-0.4), ~30% mid (0.4-0.7), ~10% near (0.7-1.0)
                if (randDepth < 0.6) {
                    depth = Math.random() * 0.4;
                    radius = Math.random() * 0.7 + 0.5;
                    baseAlpha = Math.random() * 0.35 + 0.35;
                } else if (randDepth < 0.9) {
                    depth = 0.4 + Math.random() * 0.3;
                    radius = Math.random() * 0.8 + 1.0;
                    baseAlpha = Math.random() * 0.3 + 0.55;
                } else {
                    depth = 0.7 + Math.random() * 0.3;
                    radius = Math.random() * 1.0 + 1.6;
                    // Near-band stars render at slightly higher base brightness
                    baseAlpha = Math.random() * 0.2 + 0.75;
                }

                const baseX = Math.random() * w;
                const baseY = Math.random() * h;
                const color = STAR_PALETTES[Math.floor(Math.random() * STAR_PALETTES.length)];

                // STEP 7: Twinkle properties (~20-30% twinkle, rest static)
                const twinkles = Math.random() < 0.25;
                const twinkleSpeed = 0.0015 + Math.random() * 0.0035;
                const twinklePhase = Math.random() * Math.PI * 2;

                return {
                    baseX,
                    baseY,
                    x: baseX,
                    y: baseY,
                    depth,
                    radius,
                    baseAlpha,
                    color,
                    twinkles,
                    twinkleSpeed,
                    twinklePhase
                };
            }

            // STEP 4: Resize canvas & clamp star positions
            function resize() {
                dpr = window.devicePixelRatio || 1;
                const oldWidth = width;
                const oldHeight = height;

                width = window.innerWidth;
                height = window.innerHeight;

                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const targetCount = calculateTargetStarCount(width, height);

                if (stars.length === 0) {
                    for (let i = 0; i < targetCount; i++) {
                        stars.push(createStar(width, height));
                    }
                } else {
                    // Clamp existing star positions into new bounds rather than discarding
                    stars.forEach(star => {
                        if (oldWidth > 0 && oldHeight > 0) {
                            star.baseX = (star.baseX / oldWidth) * width;
                            star.baseY = (star.baseY / oldHeight) * height;
                        }
                        star.baseX = Math.max(0, Math.min(width, star.baseX));
                        star.baseY = Math.max(0, Math.min(height, star.baseY));
                        star.x = star.baseX;
                        star.y = star.baseY;
                    });

                    // Adjust star count to match target
                    if (stars.length < targetCount) {
                        const toAdd = targetCount - stars.length;
                        for (let i = 0; i < toAdd; i++) {
                            stars.push(createStar(width, height));
                        }
                    } else if (stars.length > targetCount) {
                        stars.length = targetCount;
                    }
                }

                if (prefersReducedMotion) {
                    renderStaticFrame();
                }
            }

            // STEP 6: Mouse move & leave listeners
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                hasMouse = true;
            }, { passive: true });

            window.addEventListener('mouseleave', () => {
                hasMouse = false;
            });

            // STEP 8: Scroll listener for warp effect
            function onScroll(e) {
                const now = performance.now();
                const dt = Math.max(1, now - lastScrollTime);
                const target = (e.target === document || e.target === window) ? window : e.target;
                const currentY = target.scrollTop !== undefined ? target.scrollTop : (window.scrollY || 0);
                const delta = Math.abs(currentY - (target._lastY || 0));
                target._lastY = currentY;
                lastScrollTime = now;

                if (delta > 1) {
                    const speed = delta / dt;
                    warpIntensity = Math.min(1.0, warpIntensity + speed * 0.6);
                }
            }
            window.addEventListener('scroll', onScroll, { passive: true, capture: true });

            // Render single static frame for prefers-reduced-motion
            function renderStaticFrame() {
                ctx.clearRect(0, 0, width, height);
                stars.forEach(star => {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${star.baseAlpha})`;
                    ctx.arc(star.baseX, star.baseY, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // STEP 9: Single requestAnimationFrame render loop
            function animate(now) {
                if (prefersReducedMotion) return;

                if (document.visibilityState === 'hidden') {
                    animationId = requestAnimationFrame(animate);
                    return;
                }

                time = now || performance.now();

                // 1. Clear canvas
                ctx.clearRect(0, 0, width, height);

                // 2. Mouse offset easing & decay back to center on mouseleave
                let targetOffsetX = 0;
                let targetOffsetY = 0;
                if (hasMouse) {
                    targetOffsetX = (mouseX - width / 2) / (width / 2);
                    targetOffsetY = (mouseY - height / 2) / (height / 2);
                    targetOffsetX = Math.max(-1, Math.min(1, targetOffsetX));
                    targetOffsetY = Math.max(-1, Math.min(1, targetOffsetY));
                }
                currentOffsetX += (targetOffsetX - currentOffsetX) * PARALLAX_EASE;
                currentOffsetY += (targetOffsetY - currentOffsetY) * PARALLAX_EASE;

                // 3. Smooth warp intensity decay
                warpIntensity *= 0.92;
                if (warpIntensity < 0.005) warpIntensity = 0;

                const centerX = width / 2;
                const centerY = height / 2;

                // 4. Draw stars
                stars.forEach(star => {
                    // STEP 6: Eased target position
                    const targetX = star.baseX - currentOffsetX * MAX_PARALLAX_PX * star.depth;
                    const targetY = star.baseY - currentOffsetY * MAX_PARALLAX_PX * star.depth;
                    star.x += (targetX - star.x) * PARALLAX_EASE;
                    star.y += (targetY - star.y) * PARALLAX_EASE;

                    // STEP 7: Alpha computation
                    let alpha = star.baseAlpha;
                    if (star.twinkles) {
                        alpha = star.baseAlpha * (0.6 + 0.4 * Math.sin(time * star.twinkleSpeed + star.twinklePhase));
                    }

                    // Draw (Circle vs Radial Warp Streak)
                    if (warpIntensity > 0.02) {
                        // STEP 8: Warp streak outward from center
                        let vecX = star.x - centerX;
                        let vecY = star.y - centerY;
                        const dist = Math.hypot(vecX, vecY) || 1;
                        const dirX = vecX / dist;
                        const dirY = vecY / dist;

                        const streakLength = warpIntensity * star.depth * star.radius * 14;

                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${alpha})`;
                        ctx.lineWidth = Math.max(0.8, star.radius * 0.9);
                        ctx.lineCap = 'round';
                        ctx.moveTo(star.x, star.y);
                        ctx.lineTo(star.x + dirX * streakLength, star.y + dirY * streakLength);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.fillStyle = `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${alpha})`;
                        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // 5. Request next frame
                animationId = requestAnimationFrame(animate);
            }

            // Debounced resize (150ms)
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(resize, 150);
            });

            // STEP 10: Reduced motion preference changes
            const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            mediaQuery.addEventListener('change', (e) => {
                prefersReducedMotion = e.matches;
                if (prefersReducedMotion) {
                    if (animationId) cancelAnimationFrame(animationId);
                    renderStaticFrame();
                } else {
                    animationId = requestAnimationFrame(animate);
                }
            });

            // Initialize starfield
            resize();
            if (!prefersReducedMotion) {
                animationId = requestAnimationFrame(animate);
            }
        })();
    </script>

    <source src="/a.mp3" type="audio/mpeg">
    Aapka browser audio element ko support nahi karta.
</audio>
